name: Feature request
description: Propose an improvement to the API or its data model
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What can a rider, an operator or a client app not do today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: Endpoint / field / behaviour. Link the contract section in docs/API.md if relevant. }
    validations: { required: true }
  - type: dropdown
    id: data
    attributes:
      label: Does it work with open data only?
      options: ["Yes (GTFS / GTFS-RT / GBFS / OSM)", "Needs a partner API or agreement", "Not sure"]
    validations: { required: true }
