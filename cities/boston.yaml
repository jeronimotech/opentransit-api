id: boston
name: Boston
country: US
timezone: America/New_York
locale: en-US
center: { lat: 42.3601, lon: -71.0589 }
bbox: [-71.90, 41.55, -70.20, 42.85]              # MBTA incl. commuter rail; Cape Cod RTA rides along
default_zoom: 12
modes: [WALK, BUS, SUBWAY, TRAM, RAIL, FERRY, BICYCLE]
branding:
  primary_color: "#165C96"                        # MBTA blue
features:
  realtime_vehicles: true
  trip_updates: true
  alerts: true
  fares: false
  bike_share: true
  on_demand: true
attribution: "Data: Massachusetts Bay Transportation Authority (GTFS + GTFS-Realtime) · Bluebikes (GBFS) · Map: © OpenMapTiles © OpenStreetMap contributors"
feeds:
  gtfs_static_url: https://cdn.mbta.com/MBTA_GTFS.zip
  rt_positions_url: https://cdn.mbta.com/realtime/VehiclePositions.pb
  rt_tripupdates_url: https://cdn.mbta.com/realtime/TripUpdates.pb
  rt_alerts_url: https://cdn.mbta.com/realtime/Alerts.pb
  poll_seconds: 15
  static_refresh_hours: 24
otp:
  base_url: ${OTP_BOSTON_URL:-${OTP_URL:-http://localhost:8080}}
  feed_id: boston
geocoder:
  photon_url: https://photon.komoot.io
agencies:
  - { id: "1", name: "MBTA", component: bus, color: "#165C96" }
  - { id: "3", name: "Cape Cod Regional Transit Authority", component: bus, color: "#6C757D" }
route_type_components:
  "0": tram      # Green Line, Mattapan
  "1": rail      # Red, Orange, Blue
  "2": rail      # Commuter Rail
  "3": bus
  "4": ferry
components:
  - { id: rail,  label: "Subway · Rail", color: "#DA291C", icon: rail }
  - { id: tram,  label: "Green Line",    color: "#00843D", icon: tram }
  - { id: bus,   label: "Bus",           color: "#FFC72C", icon: bus }
  - { id: ferry, label: "Ferry",         color: "#008EAA", icon: ferry }
config:
  vehicle_poll_seconds: 20
  departures_refresh_seconds: 20
  features: { liveVehicles: true, board: true, pois: true, followAlong: true, bike: true }
  min_app_version: { ios: "1.0.0", android: "1.0.0" }
  update_urls:
    ios: "itms-beta://beta.itunes.apple.com/v1/app/6809010622"
    android: "https://play.google.com/store/apps/details?id=com.jeronimotech.opentransit"
  analytics: { enabled: true, retention_days: 90, k_threshold: 5 }
links:
  support: https://www.mbta.com/customer-support
  privacy: https://www.mbta.com/policies/privacy-policy
mobility:
  bike_share:
    - id: bluebikes
      name: Bluebikes
      network: lyft_bos                            # = system_id in the feed
      gbfs_url: https://gbfs.bluebikes.com/gbfs/gbfs.json
      color: "#2E86DE"
      url: https://bluebikes.com/
      apps:
        ios: https://apps.apple.com/us/app/id1049727856
        android: https://play.google.com/store/apps/details?id=com.motivateco.bostonapp
      pricing_summary: "Single ride $2.95 (30 min) · Day pass $10 · Annual $129"
      single_trip_price: { amount: 2.95, currency: USD, label: "Single ride (30 min)" }
      form_factors: [bicycle]
  on_demand:
    - id: uber
      name: Uber
      kind: ridehail
      color: "#000000"
      text_color: "#FFFFFF"
      estimate: { kind: none }
      handoff:
        kind: template
        template: "https://m.uber.com/looking?client_id={clientId}&pickup={pickupJson}&drop[0]={dropoffJson}"
        web: https://m.uber.com/
        apps: { ios: "https://apps.apple.com/us/app/id368677368", android: "https://play.google.com/store/apps/details?id=com.ubercab" }
      credentials: { clientId: "${UBER_CLIENT_ID:-}" }
      enabled: true
      order: 1
landing:
  enabled: true
  slug: null
  locale: en
  theme: { primary_color: null, accent_color: "#165C96", logo_url: null, hero_image_url: null, dark_hero: true }
  hero:
    title: "Ride Greater Boston with live data"
    subtitle: "Subway, bus, commuter rail, ferries and Bluebikes in one trip, with live vehicles and arrivals. Free, no account, open source."
    cta_primary: { label: "Open the web app", url: null }
    cta_secondary: { label: "How it works", url: "#features" }
  apps: { ios: null, android: null, web: null }
  highlights:
    - { icon: route, title: "Door to door", text: "The T, buses, commuter rail, ferries, Bluebikes and walking combined into one itinerary, from an address rather than a stop." }
    - { icon: live,  title: "Vehicles in real time", text: "MBTA's live positions on the map, with the direction each vehicle is heading." }
    - { icon: board, title: "Arrivals at your stop", text: "Live predictions from the MBTA feed paired with the schedule — and we say which is which." }
    - { icon: bike,  title: "Bluebikes", text: "Stations with live bike and dock counts, planned as part of the trip with the single-ride price." }
    - { icon: alarm, title: "Scheduled trips", text: "Home → Work by 9:00, or an appointment tomorrow: a reminder the evening before, twenty minutes before leaving with live data, and when it is time to go." }
    - { icon: go,    title: "Follow along", text: "Your trip on the lock screen, the Dynamic Island and Apple Watch: when your train comes, when to get off and how long is left." }
    - { icon: open,  title: "Open data", text: "Built on the MBTA's GTFS and GTFS-Realtime and Bluebikes' GBFS. No accounts, no trackers, no ads; your trips and favourites stay on your device." }
    - { icon: globe, title: "In your language", text: "English, Spanish, Portuguese, French, Italian, Malay and Arabic: the app speaks the language of whoever uses it, visitors included." }
  screenshots: []
  stats: { show: true, items: [routes, stops, vehiclesLive, bikeStations, alertsActive] }
  partners:
    - { name: "MBTA", logo_url: null, url: https://www.mbta.com, role: "GTFS and GTFS-Realtime" }
    - { name: "Bluebikes", logo_url: null, url: https://bluebikes.com, role: "GBFS bike share" }
  open_data:
    show: true
    links:
      - { label: "GTFS schedule",      url: https://cdn.mbta.com/MBTA_GTFS.zip }
      - { label: "GTFS-RT · vehicles", url: https://cdn.mbta.com/realtime/VehiclePositions.pb }
      - { label: "GTFS-RT · arrivals", url: https://cdn.mbta.com/realtime/TripUpdates.pb }
      - { label: "GTFS-RT · alerts",   url: https://cdn.mbta.com/realtime/Alerts.pb }
      - { label: "GBFS · Bluebikes",   url: https://gbfs.bluebikes.com/gbfs/gbfs.json }
  faq:
    - { q: "Do I need an account?", a: "No. It works without signing up, without requiring your location and without ads. Favourites stay on your device." }
    - { q: "Where do the arrival times come from?", a: "From the MBTA's own GTFS-Realtime feed. When there is no live prediction we show the schedule and say so." }
    - { q: "Is the fare shown?", a: "Not yet for Boston. Check mbta.com/fares for CharlieCard fares and passes." }
    - { q: "Can I use this for my city?", a: "Yes. The whole project is open source (MIT). Any city with a GTFS feed can deploy it and configure it without writing code." }
  contact:
    email: null
    url: https://www.mbta.com/customer-support
    social: { x: null, instagram: null, facebook: null, youtube: null, github: https://github.com/jeronimotech }
  footer: { legal_name: null, privacy_url: null, terms_url: null, attribution: null }
  seo:
    title: "Boston transit, live · open-source trip planner"
    description: "Plan trips across Greater Boston with live MBTA vehicles, arrivals at your stop, Bluebikes and open data. Free and open source."
    og_image_url: null
