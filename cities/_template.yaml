# Copy to cities/<slug>.yaml. Every key below is read by app/cities.py.
# Environment variables can be interpolated as ${VAR} or ${VAR:-default}.
id: mycity                       # URL slug, [a-z0-9-]
name: My City
country: XX                      # ISO 3166-1 alpha-2
timezone: Region/City            # IANA
locale: es-XX                    # BCP-47, used for number/date formatting hints
center: { lat: 0.0, lon: 0.0 }
bbox: [minLon, minLat, maxLon, maxLat]
default_zoom: 12
modes: [WALK, BUS]               # subset of WALK,BUS,RAIL,SUBWAY,TRAM,CABLE_CAR,FERRY,BICYCLE
branding:
  primary_color: "#1565C0"
  logo_url: null
features:
  realtime_vehicles: false       # true only if rt_positions_url is set
  trip_updates: false
  alerts: false
  fares: false
  bike_share: false
  on_demand: false               # v1.4: true when `mobility.on_demand` lists at least one enabled provider
attribution: "Data: <agency> (GTFS) · Map: © OpenMapTiles © OpenStreetMap contributors"

feeds:
  gtfs_static_url: https://example.org/gtfs.zip
  rt_positions_url: null
  rt_tripupdates_url: null
  rt_alerts_url: null
  poll_seconds: 20
  static_refresh_hours: 24

otp:
  base_url: ${OTP_MYCITY_URL:-${OTP_URL:-http://localhost:8081}}   # OTP_<CITY>_URL overrides the shared OTP_URL
  feed_id: mycity                # == transitFeeds[].feedId in otp/<slug>/build-config.json

geocoder:
  photon_url: https://photon.komoot.io

agencies:                        # agency_id as in agency.txt -> component + color
  - { id: "1", name: "Main operator", component: other, color: "#1565C0" }

# ── v1.1 (all optional) ─────────────────────────────────────────────────────────
components:                      # palette per component; derived from `agencies` when omitted
  - { id: other, label: Bus, color: "#1565C0", icon: bus }   # icon: brt|bus|cable|rail|tram|ferry
fares: null                      # or { currency: XXX, base: 0, transfer: 0, transfer_window_minutes: 90, max_transfers: 2, note: "" }
config:
  vehicle_poll_seconds: 15
  departures_refresh_seconds: 20
  features: { liveVehicles: true, board: true, pois: true, followAlong: true, bike: true }
  min_app_version: { ios: "1.0.0", android: "1.0.0" }
  maintenance: { active: false, message: null }
links: { pqrs: null, recharge: null, support: null, privacy: null }
services: []                     # [{ id, label, icon, url, kind: external|deeplink }]
mobility:                        # v1.2 shared mobility; each entry is a GBFS feed + the OTP `vehicle-rental` updater network id
  bike_share: []                 # [{ id, name, network, gbfs_url, color, url, apps: {ios, android}, pricing_summary, single_trip_price: {amount, currency, label}, form_factors }]
  # ── v1.4 on-demand mobility (taxi / ride-hailing); all optional, admin-editable, credentials masked ──
  taxi_tariffs: []               # [{ id, name, currency, flag_fall, unit_price, unit_meters, unit_seconds, minimum_fare,
                                 #    surcharges: [{ id, label, amount, when: { night_from, night_to, sundays, holidays, zones: [], optional } }],
                                 #    zones: [{ id, name, polygon: [[lon, lat], ...] }], source: { label, url }, valid_from, note,
                                 #    waiting_share: 0.15, rounding: 100, band_pct: 0.10 }]
  on_demand: []                  # [{ id, name, kind: taxi|ridehail, color, text_color, logo_url,
                                 #    estimate: { kind: tariff|api|none, tariff_id }, handoff: { kind: none|url|template, template, web, apps: {ios, android}, scheme },
                                 #    credentials: { clientId: "${MY_PROVIDER_CLIENT_ID:-}" }, enabled, order }]
                                 # template placeholders: {clientId} {pickupLat} {pickupLon} {pickupName} {dropoffLat} {dropoffLon} {dropoffName} {pickupJson} {dropoffJson}
  on_demand_policy: { max_direct_distance_km: 40, first_last_mile: true, max_feeder_km: 8, show_when_transit_faster: true }
# pois_file: mycity/pois.geojson # default cities/<slug>/pois.geojson (built by scripts/build-pois.sh)
# ── v1.3 · white-label landing page (optional; admin-editable; GET /v1/cities/<slug>/landing) ──
landing:
  enabled: false                 # true -> the web app serves /<slug>/landing (or "/" in single-city deployments)
  locale: null                   # null -> city locale
  theme: { primary_color: null, accent_color: null, logo_url: null, hero_image_url: null, dark_hero: true }   # nulls fall back to branding
  hero:
    title: "Move around My City with live data"
    subtitle: "Plan trips, find your bus, arrive on time. Free, no account, open source."
    cta_primary: { label: "Open the app", url: null }          # null -> the web app's /<slug>
    cta_secondary: { label: "How it works", url: "#features" } # https, "#anchor" or "/path"
  apps: { ios: null, android: null, web: null }                # store URLs; null hides the badge
  highlights: []                 # ≤ 8 × { icon: route|live|board|bike|open|alert|accessibility|favorites|offline|map|ticket|info, title, text }
  screenshots: []                # ≤ 8 × { url (https), alt, kind: mobile|web }
  stats: { show: true, items: [routes, stops, vehiclesLive, bikeStations, alertsActive] }
  partners: []                   # ≤ 12 × { name, logo_url, url, role }
  open_data: { show: true, links: [] }   # empty links -> derived from feeds + bike-share config
  faq: []                        # ≤ 12 × { q, a }
  contact: { email: null, url: null, social: { x: null, instagram: null, facebook: null, youtube: null, github: null } }
  footer: { legal_name: null, privacy_url: null, terms_url: null, attribution: null }   # nulls fall back to links.privacy / attribution
  seo: { title: null, description: null, og_image_url: null }
