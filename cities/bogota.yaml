# Bogotá, Colombia — TransMilenio + SITP (troncal, zonal, alimentador, dual, TransMiCable)
id: bogota
name: Bogotá
country: CO
timezone: America/Bogota
locale: es-CO
center: { lat: 4.6534, lon: -74.0836 }
bbox: [-74.45, 3.95, -73.85, 4.90]   # minLon, minLat, maxLon, maxLat
default_zoom: 12
modes: [WALK, BUS, CABLE_CAR, BICYCLE]
branding:
  primary_color: "#D32F2F"
  logo_url: null
features:
  realtime_vehicles: true
  trip_updates: true
  alerts: true
  fares: false
  bike_share: true
  on_demand: true             # v1.4: taxi / ride-hailing options (providers below)
  open_mobility: true         # v1.6: CDS curbs — Bogotá's paid on-street parking (ZPP), via PIM
attribution: "Datos: TRANSMILENIO S.A. (GTFS) · Mapa: © OpenMapTiles © OpenStreetMap contributors"

feeds:
  gtfs_static_url: https://gtfs.transmilenio.gov.co/GTFS.zip
  rt_positions_url: https://gtfs.transmilenio.gov.co/positions.pb
  rt_tripupdates_url: https://gtfs.transmilenio.gov.co/tripupdates.pb
  rt_alerts_url: https://gtfs.transmilenio.gov.co/alerts.pb
  poll_seconds: 15            # upstream refreshes every ~15 s
  static_refresh_hours: 24

otp:
  base_url: ${OTP_BOGOTA_URL:-${OTP_URL:-http://localhost:8080}}   # per-city override, else the shared default
  feed_id: bogota             # must match build-config.json transitFeeds[].feedId

geocoder:
  photon_url: https://photon.komoot.io   # null disables Photon (GTFS stops only)
  # v2.2: Bogotá's cadastral geocoder (IDECA / Catastro Distrital) for addresses and intersections —
  # "Cra 10 # 15-22 Sur", "Calle 127 con Carrera 7" — which OSM does not know. Names stay with Photon.
  ideca:
    enabled: true
    url: https://catalogopmb.catastrobogota.gov.co/PMBWeb/web/api
    api_key: ${IDECA_API_KEY:-}
    # named avenues the geocoder only knows by their nomenclature
    aliases:
      "avenida boyacá": "AK 72"
      "avenida boyaca": "AK 72"
      "av boyacá": "AK 72"
      "av boyaca": "AK 72"
      "av. boyacá": "AK 72"
      "av. boyaca": "AK 72"
      "autopista norte": "AK 45"
      "autonorte": "AK 45"
      "auto norte": "AK 45"
      "avenida ciudad de cali": "AK 86"
      "avenida cali": "AK 86"
      "av cali": "AK 86"
      "av. cali": "AK 86"
      "avenida nqs": "AK 30"
      "nqs": "AK 30"
      "avenida ciudad de quito": "AK 30"
      "avenida caracas": "KR 14"
      "av caracas": "KR 14"
      "av. caracas": "KR 14"
      "avenida 68": "AK 68"
      "av 68": "AK 68"
      "av. 68": "AK 68"
      "avenida el dorado": "AC 26"
      "av el dorado": "AC 26"
      "avenida eldorado": "AC 26"
      "avenida la esperanza": "AC 24"
      "avenida esperanza": "AC 24"
      "av esperanza": "AC 24"
      "avenida de las américas": "AC 9"
      "avenida de las americas": "AC 9"
      "avenida las américas": "AC 9"
      "avenida las americas": "AC 9"
      "av américas": "AC 9"
      "av americas": "AC 9"
      "avenida chile": "AC 72"
      "av chile": "AC 72"
      "avenida jiménez": "AC 13"
      "avenida jimenez": "AC 13"
      "avenida primero de mayo": "AC 22 SUR"
      "avenida primera de mayo": "AC 22 SUR"
      "av primero de mayo": "AC 22 SUR"
      "avenida suba": "AV SUBA"
      "av suba": "AV SUBA"
      "avenida séptima": "KR 7"
      "avenida septima": "KR 7"
      "carrera séptima": "KR 7"
      "carrera septima": "KR 7"
      "avenida décima": "KR 10"
      "avenida decima": "KR 10"
      "avenida calle 80": "AC 80"
      "calle 80": "AC 80"
      "avenida 1 de mayo": "AC 22 SUR"
  # Named areas from Catastro's reference map (Datos Abiertos Bogotá): 1 231 sectores catastrales (barrios)
  # and the 20 localidades, mirrored monthly. "Chicó" is then the neighbourhood, not a stop named like it.
  # Catastro's GIS server (serviciosgis.catastrobogota.gov.co/…/Mapa_Referencia/MapServer/37 and /48) answers
  # only from Colombia, so `scripts/mirror_places.py bogota --upload` republishes the layers as release assets.
  areas:
    enabled: true
    barrios_url: https://github.com/jeronimotech/opentransit-api/releases/download/places-bogota/bogota-barrios.geojson
    localidades_url: https://github.com/jeronimotech/opentransit-api/releases/download/places-bogota/bogota-localidades.geojson
    refresh_days: 30

# agency_id -> component. Component drives colors/icons in the apps.
agencies:
  - { id: "1", name: "TransMilenio Troncal",  component: trunk,  color: "#D32F2F" }
  - { id: "2", name: "Alimentadores",         component: feeder, color: "#2E7D32" }
  - { id: "3", name: "Dual",                  component: dual,   color: "#6A1B9A" }
  - { id: "4", name: "SITP Zonal Urbano",     component: zonal,  color: "#1565C0" }
  - { id: "5", name: "SITP Complementario",   component: zonal,  color: "#F57C00" }
  - { id: "6", name: "SITP Especial",         component: zonal,  color: "#00838F" }
  - { id: "7", name: "TransMiCable",          component: cable,  color: "#5D4037" }

# ── v1.1 ────────────────────────────────────────────────────────────────────────
# Component palette (icons/colors used everywhere in the apps). Ids match `agencies[].component`.
components:
  - { id: trunk,  label: Troncal,       color: "#D32F2F", icon: brt }
  - { id: feeder, label: Alimentador,   color: "#2E7D32", icon: bus }
  - { id: dual,   label: Dual,          color: "#6A1B9A", icon: bus }
  - { id: zonal,  label: Zonal (SITP),  color: "#1565C0", icon: bus }
  - { id: cable,  label: TransMiCable,  color: "#EF6C00", icon: cable }

# Flat-fare estimate: the GTFS publishes no fares. VERIFY against the tariff in force before release.
# Bogotá 2026: pasaje único troncal/zonal/cable, transbordos sin costo dentro de la ventana de integración.
fares:
  currency: COP
  base: 3200
  transfer: 0
  transfer_window_minutes: 110
  max_transfers: 2
  note: "Valor estimado (configurable). Verificar con la tarifa vigente de TRANSMILENIO S.A."

# Remote-configurable client behaviour (read by web and mobile on start-up).
config:
  # v2.3 scheduled-trip reminders on iPhone: a silent wake-up twenty minutes before leaving and alert
  # pushes for followed routes. Needs an APNs key (developer portal → Keys → APNs) in the environment.
  push:
    reminders: true
    apns:
      key_id: ${APNS_KEY_ID:-}
      team_id: ${APNS_TEAM_ID:-6DTDJCKC8X}
      bundle_id: com.jeronimotech.opentransit
      key_p8: "${APNS_KEY_P8:-}"     # base64 of the .p8 (one line)
    fcm:
      # base64 of the whole service-account JSON, on one line (a raw multi-line value would tear
      # this file apart at start-up, which is how the APNs key once took the API down).
      service_account_json: "${FCM_SERVICE_ACCOUNT_JSON:-}"
  vehicle_poll_seconds: 15
  departures_refresh_seconds: 20
  features: { liveVehicles: true, board: true, pois: true, followAlong: true, bike: true }
  min_app_version: { ios: "1.0.0", android: "1.0.0" }
  # Where a blocked build is sent. Changing this needs no app release, which is the
  # point: someone stuck on an old build can only be redirected by data. Swap the iOS
  # one for https://apps.apple.com/app/id6809010622 the day the app is public.
  update_urls:
    ios: "itms-beta://beta.itunes.apple.com/v1/app/6809010622"      # TestFlight, while in internal testing
    android: "https://play.google.com/store/apps/details?id=com.jeronimotech.opentransit"
  maintenance: { active: false, message: null }
  # v1.5 first-party analytics: anonymous, aggregated, k-anonymity on every read/export (admin-editable)
  analytics: { enabled: true, retention_days: 90, k_threshold: 5 }
  # v2.0 conversational assistant. Off until a key is configured; the key never leaves the server and the
  # model may only answer from our own tools, so it cannot invent a departure time.
  assistant:
    # Off by default: a fresh clone has no key, and an enabled-but-keyless
    # assistant only shows a chat button that errors on every question.
    # Set ASSISTANT_API_KEY and flip this in the admin panel (the override
    # lives in the database, not here).
    enabled: false
    provider: deepseek           # anthropic | openai | deepseek | gemini
    model: null                  # null -> the provider's documented default (see docs/API.md)
    api_key: ${ASSISTANT_API_KEY:-}
    base_url: null
    max_replies_per_session: 30
    max_tool_calls_per_reply: 6
    daily_budget_usd: 5.0
    rate_limit_per_minute: 6
    system_extra: null
    log_conversations: false

# Official public pages (verified 2026-09-04). Never private/credentialed endpoints.
links:
  pqrs: https://www.transmilenio.gov.co/publicaciones/147212/pqrs
  recharge: https://www.tullaveplus.gov.co/
  support: https://www.transmilenio.gov.co/publicaciones/149179
  privacy: https://www.transmilenio.gov.co/publicaciones/146028/politica-de-tratamiento-de-datos-personales

# Hand-off tiles shown in the apps' services hub (open in the browser).
services:
  - { id: recharge, label: Recargar tullave, icon: card, url: https://www.tullaveplus.gov.co/, kind: external }
  - { id: pqrs, label: PQRS y reportes, icon: report, url: https://www.transmilenio.gov.co/publicaciones/147212/pqrs, kind: external }
  - { id: support, label: Canales de atención, icon: help, url: https://www.transmilenio.gov.co/publicaciones/149179, kind: external }

# ── v1.2 · shared mobility (GBFS) ───────────────────────────────────────────────
# Tembici operates Bogotá's public bike system and publishes GBFS 3.0 (verified 2026-09-04: 252 stations).
# `network` must equal the `network` of the vehicle-rental updater in otp/bogota/router-config.json.
mobility:
  bike_share:
    - id: tembici
      name: Tembici Bogotá
      network: tembici_bogota
      gbfs_url: https://bogota.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json
      color: "#00A859"
      url: https://tembici.com.co/
      apps:
        ios: https://apps.apple.com/co/app/id1298652619          # "tembici." (App Store CO)
        android: https://play.google.com/store/search?q=tembici&c=apps
      pricing_summary: null                                     # derived from system_pricing_plans when null
      single_trip_price: null                                   # { amount: 4850, currency: COP, label: "1 viaje" } to pin the estimate
      form_factors: [bicycle, scooter]

  # ── v1.4 · on-demand mobility (taxi / ride-hailing). Provider-agnostic: everything below is data. ──────
  # Taxi tariff: Decreto Distrital 042 de 2026 (Secretaría Distrital de Movilidad), in force since 2026-02-12.
  taxi_tariffs:
    - id: bogota-taxi-2026
      name: Tarifa oficial de taxi 2026
      currency: COP
      flag_fall: 4500                 # banderazo
      unit_price: 159                 # por unidad (cada 100 m, o ~30 s detenido)
      unit_meters: 100
      unit_seconds: 30
      minimum_fare: 8000              # carrera mínima
      surcharges:
        - { id: night,   label: "Nocturno / dominical / festivo", amount: 3800,
            when: { night_from: "19:00", night_to: "06:00", sundays: true, holidays: true } }
        - { id: airport, label: "Aeropuerto", amount: 8000, when: { zones: [airport] } }
        - { id: door,    label: "Puerta a puerta", amount: 1500, when: { optional: true } }
      zones:
        # Approximate box around El Dorado's terminals (T1/T2) and access roads. Refine with OSM aeroway=aerodrome.
        - id: airport
          name: Aeropuerto El Dorado
          polygon: [[-74.165, 4.684], [-74.118, 4.684], [-74.118, 4.716], [-74.165, 4.716]]
      source: { label: "Decreto Distrital 042 de 2026", url: "https://bogota.gov.co/mi-ciudad/movilidad/en-firme-el-decreto-que-fija-las-tarifas-de-taxi-en-bogota-en-2026" }
      valid_from: "2026-02-12"
      note: "Estimación según la tarifa oficial; el taxímetro manda."
      waiting_share: 0.15             # share of the drive spent stopped in traffic (meter advances by time)
      rounding: 100
      band_pct: 0.10
  # Providers shown in the planner (order = display order). Store/web links verified 2026-09-05.
  # `credentials` come from the environment (never commit real values); the admin panel shows them masked.
  on_demand:
    - id: taxi
      name: Taxi
      kind: taxi
      color: "#F2C200"
      text_color: "#111111"
      estimate: { kind: tariff, tariff_id: bogota-taxi-2026 }
      handoff:
        kind: url
        web: https://www.taxislibres.com.co/
        apps: { ios: "https://apps.apple.com/co/app/id686270238", android: "https://play.google.com/store/search?q=taxis%20libres&c=apps" }
      enabled: true
      order: 1
    - id: uber
      name: Uber
      kind: ridehail
      color: "#000000"
      text_color: "#FFFFFF"
      estimate: { kind: none }        # estimates need Uber's partner API; the hand-off prefills the trip
      handoff:
        kind: template
        template: "https://m.uber.com/looking?client_id={clientId}&pickup={pickupJson}&drop[0]={dropoffJson}"
        web: https://m.uber.com/
        apps: { ios: "https://apps.apple.com/co/app/id368677368", android: "https://play.google.com/store/apps/details?id=com.ubercab" }
      credentials: { clientId: "${UBER_CLIENT_ID:-}" }
      enabled: true
      order: 2
    - id: cabify
      name: Cabify
      kind: ridehail
      color: "#7145D6"
      text_color: "#FFFFFF"
      estimate: { kind: none }
      handoff:
        kind: url
        web: https://cabify.com/co
        apps: { ios: "https://apps.apple.com/co/app/id476087442", android: "https://play.google.com/store/apps/details?id=com.cabify.rider" }
      enabled: true
      order: 3
    - id: didi
      name: DiDi
      kind: ridehail
      color: "#FF7F41"
      text_color: "#111111"
      estimate: { kind: none }
      handoff:
        kind: url
        web: https://web.didiglobal.com/co/
        apps: { ios: "https://apps.apple.com/co/app/id1362398401", android: "https://play.google.com/store/apps/details?id=com.didiglobal.passenger" }
      enabled: true
      order: 4
    - id: indrive
      name: inDrive
      kind: ridehail
      color: "#A6E22E"
      text_color: "#111111"
      estimate: { kind: none }
      handoff:
        kind: url
        web: https://indrive.com/
        apps: { ios: "https://apps.apple.com/co/app/id780125801", android: "https://play.google.com/store/apps/details?id=sinet.startup.inDriver" }
      enabled: true
      order: 5
  on_demand_policy:
    max_direct_distance_km: 40
    first_last_mile: true
    max_feeder_km: 8
    show_when_transit_faster: true
    duration_factor: 1.5            # OTP routes cars at free-flow speed; Bogotá traffic is ~50 % slower by day
    night_duration_factor: 1.1      # inside the tariff's night window (19:00–06:00)

# ── v1.3 · white-label landing page (served by /v1/cities/bogota/landing, editable in the admin panel) ──
# Screenshots are the web app's own live captures (docs/screenshots on jeronimotech/opentransit-web main).
# ── v1.6 · open mobility. The curb inventory is Bogotá's paid on-street parking (ZPP — Zonas de Parqueo
# Pago), mirrored from PIM, the Secretaría de Movilidad's micromobility platform (partner API, read-only
# scopes). Verified 2026-09-14: 819 kerbs with occupancy and 63 policies with hours and rates (integers in
# centavos, converted to pesos at ingestion). The `segments` layer (per-space, 1 101 in a 4 km bbox in ~2 s) is not
# read yet. Occupancy in DEV is not live — the median `last_updated` was 2.5 h old — so the mirror runs every
# 15 min and skips the rewrite when PIM's content ETag says nothing changed.
open_mobility:
  cds:
    enabled: true
    publish: false
    curbs:
      source: pim
      url: https://apim-pim-mds-dev.azure-api.net       # the gateway; the direct app-api-mds-dev host also works
      provider_id: ae86d0c3-fe7e-4eda-b57d-7f8232b71fd8 # "ZPP — Zonas de Parqueo Pago"
      refresh_minutes: 15
      timeout_seconds: 120
      rate_minor_units: 100    # PIM quotes centavos: 660000 is $ 6.600 an hour
      credentials: { clientId: "${PIM_CLIENT_ID:-}", clientSecret: "${PIM_CLIENT_SECRET:-}" }
    rate_currency: COP
    rate_minor_units: 1          # whole pesos, city-wide (PIM's centavos are converted at ingestion)
    events: { accept: false, providers: [] }
  mds: { enabled: false }
  # Park & ride: drive to a ZPP zone next to a station, walk, ride. 600 m is a real walk with a bag; 8 h is
  # a working day, which is what the fee estimate on the card assumes (the zone's own rates, tiered).
  park_ride: { enabled: true, max_drive_km: 25.0, max_walk_meters: 600, default_dwell_hours: 8.0 }

landing:
  enabled: true
  slug: null                       # null -> /{city}/landing in the web app; a single-city deploy can mount it at "/"
  locale: es
  theme: { primary_color: null, accent_color: "#1565C0", logo_url: null, hero_image_url: null, dark_hero: true }
  hero:
    title: "Muévete por Bogotá con datos en vivo"
    subtitle: "Planea en bus, bici, taxi o carro + bus; ubica tu bus y deja que te avisemos cuándo salir. Gratis, sin cuenta y de código abierto."
    cta_primary: { label: "Abrir la app web", url: null }
    cta_secondary: { label: "Cómo funciona", url: "#features" }
  apps: { ios: null, android: null, web: null }   # store URLs when the apps are published
  highlights:
    - { icon: route,   title: "Viajes multimodales",     text: "Troncal, zonal, alimentador, TransMiCable, bici propia o pública y a pie, combinados en un solo itinerario, con hora de salida o de llegada." }
    - { icon: live,    title: "Buses en vivo",           text: "Miles de buses en el mapa con su posición real cada 15 segundos, y alertas de desvíos en las rutas que sigues." }
    - { icon: board,   title: "Ubica tu bus",            text: "Elige tu estación y tu ruta: te decimos cuándo llegan los próximos buses, en vivo o por programación." }
    - { icon: alarm,   title: "Viajes programados",      text: "Casa → Trabajo a las 8:00, o una cita mañana: te avisamos la noche anterior, 20 minutos antes con datos en vivo y a la hora de salir." }
    - { icon: go,      title: "Iniciar viaje",           text: "Sigue tu viaje en pantalla de bloqueo, Dynamic Island y Apple Watch: cuándo pasa tu bus, cuándo bajarte y cuánto falta." }
    - { icon: taxi,    title: "Taxi y apps de transporte", text: "Compara el taxi con tarifa oficial y las apps de la ciudad, solo o como primer y último tramo de un viaje en bus." }
    - { icon: parking, title: "Carro + bus",             text: "Deja el carro en una zona de parqueo pago cerca de la estación —con cupos en vivo y precio— y sigue en transporte público." }
    - { icon: bike,    title: "Bicis públicas",          text: "Estaciones y bicis disponibles integradas al planeador, con precio estimado por viaje." }
    - { icon: map,     title: "Direcciones de Bogotá",   text: "Escribe «Cra 7 # 72-41», «Calle 127 con Carrera 7» o un barrio: resolvemos la nomenclatura con el geocodificador de Catastro." }
    - { icon: chat,    title: "Pregúntame",              text: "Un asistente que planea y consulta con los datos de la app, nunca de memoria, y responde con tarjetas que abren la pantalla real." }
    - { icon: open,    title: "Datos abiertos y privacidad", text: "GTFS, GTFS-Realtime, GBFS y CDS publicados por la ciudad. Sin cuentas ni rastreadores; tus viajes y favoritos viven en tu dispositivo." }
    - { icon: globe, title: "En tu idioma", text: "Español, inglés, portugués, francés, italiano, malayo y árabe: la app habla el idioma de quien la usa, también de quien visita Bogotá." }
  screenshots:
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/hub-mobile-live-api.png,       alt: "Mapa en vivo con paradas cercanas", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/next-mobile-live-api.png,      alt: "Ubica tu bus: próximos buses en tu estación", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/itinerary-mobile-live-api.png, alt: "Detalle de un itinerario", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/stop-mobile-live-api.png,      alt: "Tablero de llegadas de una estación", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/hub-desktop-live-api.png,      alt: "Planeador en escritorio", kind: web }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/live-desktop-live-api.png,     alt: "Flota en vivo en escritorio", kind: web }
  stats: { show: true, items: [routes, stops, vehiclesLive, bikeStations, alertsActive] }
  partners:
    - { name: "TRANSMILENIO S.A.", logo_url: null, url: https://www.transmilenio.gov.co, role: "Datos GTFS y GTFS-Realtime" }
    - { name: "Tembici Bogotá",    logo_url: null, url: https://tembici.com.co/,          role: "Bicicletas públicas (GBFS)" }
    - { name: "Secretaría Distrital de Movilidad · PIM", logo_url: null, url: https://www.movilidadbogota.gov.co, role: "Zonas de parqueo pago con cupos en vivo (CDS)" }
    - { name: "IDECA · Catastro Bogotá", logo_url: null, url: https://www.ideca.gov.co, role: "Geocodificador oficial, barrios y localidades" }
  open_data:
    show: true
    links:
      - { label: "GTFS estático",            url: https://gtfs.transmilenio.gov.co/GTFS.zip }
      - { label: "GTFS-RT · posiciones",     url: https://gtfs.transmilenio.gov.co/positions.pb }
      - { label: "GTFS-RT · llegadas",       url: https://gtfs.transmilenio.gov.co/tripupdates.pb }
      - { label: "GTFS-RT · alertas",        url: https://gtfs.transmilenio.gov.co/alerts.pb }
      - { label: "GBFS · bicicletas públicas", url: https://bogota.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json }
      - { label: "CDS · zonas de parqueo pago",  url: https://api.opentransit.tech/v1/cities/bogota/cds/curbs/zones }
      - { label: "Datos Abiertos Bogotá · sectores catastrales", url: https://datosabiertos.bogota.gov.co/dataset/sector-catastral-bogota-d-c }
  faq:
    - { q: "¿Necesito crear una cuenta?", a: "No. La app funciona sin registro, sin ubicación obligatoria y sin publicidad. Tus favoritos se guardan solo en tu dispositivo." }
    - { q: "¿De dónde salen los tiempos de llegada?", a: "De los datos GTFS-Realtime que publica TRANSMILENIO S.A. Cuando no hay dato en vivo, mostramos el horario programado y lo decimos claramente." }
    - { q: "¿La tarifa que muestra es exacta?", a: "Es una estimación calculada con la tarifa vigente y las reglas de transbordo. El valor definitivo lo define el sistema de recaudo." }
    - { q: "¿Cómo funcionan los avisos de un viaje programado?", a: "El viaje se guarda solo en tu teléfono. La app calcula la hora de salida con datos reales y te avisa la noche anterior, veinte minutos antes (recalculado en vivo) y a la hora de salir; ese último aviso abre el seguimiento del viaje. El servidor nunca conoce tu rutina: como mucho, en iPhone, la hora a la que despertar la app." }
    - { q: "¿De dónde salen los cupos de parqueo?", a: "De la Plataforma de Información de Micromovilidad de la Secretaría Distrital de Movilidad, en el estándar abierto CDS: cada zona de parqueo pago con sus cupos, su tarifa y su horario. Siempre mostramos la hora del último conteo." }
    - { q: "¿Puedo usar el código para mi ciudad?", a: "Sí. Todo el proyecto es de código abierto (MIT). Cualquier ciudad con GTFS puede desplegarlo y configurarlo sin escribir código." }
