# Bogotá, Colombia — TransMilenio + SITP (troncal, zonal, alimentador, dual, TransMiCable)
id: bogota
name: Bogotá
country: CO
timezone: America/Bogota
locale: es-CO
center: { lat: 4.6534, lon: -74.0836 }
bbox: [-74.45, 3.95, -73.85, 4.90]   # minLon, minLat, maxLon, maxLat
default_zoom: 12
modes: [WALK, BUS, CABLE_CAR, BICYCLE]
branding:
  primary_color: "#D32F2F"
  logo_url: null
features:
  realtime_vehicles: true
  trip_updates: true
  alerts: true
  fares: false
  bike_share: true
attribution: "Datos: TRANSMILENIO S.A. (GTFS) · Mapa: © OpenMapTiles © OpenStreetMap contributors"

feeds:
  gtfs_static_url: https://gtfs.transmilenio.gov.co/GTFS.zip
  rt_positions_url: https://gtfs.transmilenio.gov.co/positions.pb
  rt_tripupdates_url: https://gtfs.transmilenio.gov.co/tripupdates.pb
  rt_alerts_url: https://gtfs.transmilenio.gov.co/alerts.pb
  poll_seconds: 15            # upstream refreshes every ~15 s
  static_refresh_hours: 24

otp:
  base_url: ${OTP_BOGOTA_URL:-http://localhost:8080}
  feed_id: bogota             # must match build-config.json transitFeeds[].feedId

geocoder:
  photon_url: https://photon.komoot.io   # null disables Photon (GTFS stops only)

# agency_id -> component. Component drives colors/icons in the apps.
agencies:
  - { id: "1", name: "TransMilenio Troncal",  component: trunk,  color: "#D32F2F" }
  - { id: "2", name: "Alimentadores",         component: feeder, color: "#2E7D32" }
  - { id: "3", name: "Dual",                  component: dual,   color: "#6A1B9A" }
  - { id: "4", name: "SITP Zonal Urbano",     component: zonal,  color: "#1565C0" }
  - { id: "5", name: "SITP Complementario",   component: zonal,  color: "#F57C00" }
  - { id: "6", name: "SITP Especial",         component: zonal,  color: "#00838F" }
  - { id: "7", name: "TransMiCable",          component: cable,  color: "#5D4037" }

# ── v1.1 ────────────────────────────────────────────────────────────────────────
# Component palette (icons/colors used everywhere in the apps). Ids match `agencies[].component`.
components:
  - { id: trunk,  label: Troncal,       color: "#D32F2F", icon: brt }
  - { id: feeder, label: Alimentador,   color: "#2E7D32", icon: bus }
  - { id: dual,   label: Dual,          color: "#6A1B9A", icon: bus }
  - { id: zonal,  label: Zonal (SITP),  color: "#1565C0", icon: bus }
  - { id: cable,  label: TransMiCable,  color: "#EF6C00", icon: cable }

# Flat-fare estimate: the GTFS publishes no fares. VERIFY against the tariff in force before release.
# Bogotá 2026: pasaje único troncal/zonal/cable, transbordos sin costo dentro de la ventana de integración.
fares:
  currency: COP
  base: 3200
  transfer: 0
  transfer_window_minutes: 110
  max_transfers: 2
  note: "Valor estimado (configurable). Verificar con la tarifa vigente de TRANSMILENIO S.A."

# Remote-configurable client behaviour (read by web and mobile on start-up).
config:
  vehicle_poll_seconds: 15
  departures_refresh_seconds: 20
  features: { liveVehicles: true, board: true, pois: true, followAlong: true, bike: true }
  min_app_version: { ios: "1.0.0", android: "1.0.0" }
  maintenance: { active: false, message: null }

# Official public pages (verified 2026-09-04). Never private/credentialed endpoints.
links:
  pqrs: https://www.transmilenio.gov.co/publicaciones/147212/pqrs
  recharge: https://www.tullaveplus.gov.co/
  support: https://www.transmilenio.gov.co/publicaciones/149179
  privacy: https://www.transmilenio.gov.co/publicaciones/146028/politica-de-tratamiento-de-datos-personales

# Hand-off tiles shown in the apps' services hub (open in the browser).
services:
  - { id: recharge, label: Recargar tullave, icon: card, url: https://www.tullaveplus.gov.co/, kind: external }
  - { id: pqrs, label: PQRS y reportes, icon: report, url: https://www.transmilenio.gov.co/publicaciones/147212/pqrs, kind: external }
  - { id: support, label: Canales de atención, icon: help, url: https://www.transmilenio.gov.co/publicaciones/149179, kind: external }

# ── v1.2 · shared mobility (GBFS) ───────────────────────────────────────────────
# Tembici operates Bogotá's public bike system and publishes GBFS 3.0 (verified 2026-09-04: 252 stations).
# `network` must equal the `network` of the vehicle-rental updater in otp/bogota/router-config.json.
mobility:
  bike_share:
    - id: tembici
      name: Tembici Bogotá
      network: tembici_bogota
      gbfs_url: https://bogota.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json
      color: "#00A859"
      url: https://tembici.com.co/
      apps:
        ios: https://apps.apple.com/co/app/id1298652619          # "tembici." (App Store CO)
        android: https://play.google.com/store/search?q=tembici&c=apps
      pricing_summary: null                                     # derived from system_pricing_plans when null
      single_trip_price: null                                   # { amount: 4850, currency: COP, label: "1 viaje" } to pin the estimate
      form_factors: [bicycle, scooter]

# ── v1.3 · white-label landing page (served by /v1/cities/bogota/landing, editable in the admin panel) ──
# Screenshots are the web app's own live captures (docs/screenshots on jeronimotech/opentransit-web main).
landing:
  enabled: true
  slug: null                       # null -> /{city}/landing in the web app; a single-city deploy can mount it at "/"
  locale: es
  theme: { primary_color: null, accent_color: "#1565C0", logo_url: null, hero_image_url: null, dark_hero: true }
  hero:
    title: "Muévete por Bogotá con datos en vivo"
    subtitle: "Planea tu viaje, ubica tu bus y llega a tiempo. Gratis, sin cuenta y de código abierto."
    cta_primary: { label: "Abrir la app web", url: null }
    cta_secondary: { label: "Cómo funciona", url: "#features" }
  apps: { ios: null, android: null, web: null }   # store URLs when the apps are published
  highlights:
    - { icon: route, title: "Viajes multimodales", text: "Troncal, zonal, alimentador, TransMiCable, bici pública y a pie, combinados en un solo itinerario." }
    - { icon: live,  title: "Buses en vivo",       text: "Miles de buses en el mapa con su posición real cada 15 segundos." }
    - { icon: board, title: "Ubica tu bus",        text: "Elige tu estación y tu ruta: te decimos cuándo llegan los próximos buses, en vivo o por programación." }
    - { icon: bike,  title: "Bicis públicas",      text: "Estaciones y bicis disponibles integradas al planeador, con precio estimado." }
    - { icon: open,  title: "Datos abiertos",      text: "Construido sobre GTFS, GTFS-Realtime y GBFS publicados por la ciudad. Sin cuentas ni rastreadores." }
  screenshots:
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/hub-mobile-live-api.png,       alt: "Mapa en vivo con paradas cercanas", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/next-mobile-live-api.png,      alt: "Ubica tu bus: próximos buses en tu estación", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/itinerary-mobile-live-api.png, alt: "Detalle de un itinerario", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/stop-mobile-live-api.png,      alt: "Tablero de llegadas de una estación", kind: mobile }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/hub-desktop-live-api.png,      alt: "Planeador en escritorio", kind: web }
    - { url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/live-desktop-live-api.png,     alt: "Flota en vivo en escritorio", kind: web }
  stats: { show: true, items: [routes, stops, vehiclesLive, bikeStations, alertsActive] }
  partners:
    - { name: "TRANSMILENIO S.A.", logo_url: null, url: https://www.transmilenio.gov.co, role: "Datos GTFS y GTFS-Realtime" }
    - { name: "Tembici Bogotá",    logo_url: null, url: https://tembici.com.co/,          role: "Bicicletas públicas (GBFS)" }
  open_data:
    show: true
    links:
      - { label: "GTFS estático",            url: https://gtfs.transmilenio.gov.co/GTFS.zip }
      - { label: "GTFS-RT · posiciones",     url: https://gtfs.transmilenio.gov.co/positions.pb }
      - { label: "GTFS-RT · llegadas",       url: https://gtfs.transmilenio.gov.co/tripupdates.pb }
      - { label: "GTFS-RT · alertas",        url: https://gtfs.transmilenio.gov.co/alerts.pb }
      - { label: "GBFS · bicicletas públicas", url: https://bogota.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json }
  faq:
    - { q: "¿Necesito crear una cuenta?", a: "No. La app funciona sin registro, sin ubicación obligatoria y sin publicidad. Tus favoritos se guardan solo en tu dispositivo." }
    - { q: "¿De dónde salen los tiempos de llegada?", a: "De los datos GTFS-Realtime que publica TRANSMILENIO S.A. Cuando no hay dato en vivo, mostramos el horario programado y lo decimos claramente." }
    - { q: "¿La tarifa que muestra es exacta?", a: "Es una estimación calculada con la tarifa vigente y las reglas de transbordo. El valor definitivo lo define el sistema de recaudo." }
    - { q: "¿Puedo usar el código para mi ciudad?", a: "Sí. Todo el proyecto es de código abierto (MIT). Cualquier ciudad con GTFS puede desplegarlo y configurarlo sin escribir código." }
  contact:
    email: null
    url: https://www.transmilenio.gov.co/publicaciones/149179
    social: { x: null, instagram: null, facebook: null, youtube: null, github: https://github.com/jeronimotech }
  footer:
    legal_name: null
    privacy_url: null              # null -> links.privacy
    terms_url: null
    attribution: null              # null -> attribution above
  seo:
    title: "Bogotá en vivo · planeador de transporte público"
    description: "Planea viajes multimodales en Bogotá con buses en vivo, tablero de llegadas y bicis públicas. Gratis y de código abierto."
    og_image_url: https://raw.githubusercontent.com/jeronimotech/opentransit-web/main/docs/screenshots/hub-desktop-live-api.png
