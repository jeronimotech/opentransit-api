id: kualalumpur
name: Kuala Lumpur
country: MY
timezone: Asia/Kuala_Lumpur
locale: en-MY
center: { lat: 3.1390, lon: 101.6869 }
bbox: [101.38, 2.70, 101.90, 3.36]
default_zoom: 12
modes: [WALK, BUS, RAIL, SUBWAY, TRAM, BICYCLE]
branding:
  primary_color: "#E30613"                        # Rapid KL red
features:
  realtime_vehicles: true
  trip_updates: false
  alerts: false
  fares: false
  bike_share: false
  on_demand: false
attribution: "Data: Prasarana Malaysia (Rapid KL) via data.gov.my — GTFS + GTFS-Realtime · Map: © OpenMapTiles © OpenStreetMap contributors"
feeds:
  # data.gov.my publishes three feeds (Rapid Bus KL, Rapid Rail KL, MRT feeders); this is the merged one
  # rebuilt by scripts/merge_gtfs.py and published as a release asset.
  gtfs_static_url: https://github.com/jeronimotech/opentransit-api/releases/download/gtfs-kualalumpur/kualalumpur-gtfs.zip
  rt_positions_url: "https://api.data.gov.my/gtfs-realtime/vehicle-position/prasarana?category=rapid-bus-kl"
  poll_seconds: 30
  static_refresh_hours: 168
otp:
  base_url: ${OTP_KUALALUMPUR_URL:-${OTP_URL:-http://localhost:8080}}
  feed_id: kualalumpur
geocoder:
  photon_url: https://photon.komoot.io
agencies:
  - { id: "bus_rapidkl",  name: "Rapid Bus KL",   component: bus,    color: "#E30613" }
  - { id: "rail_rapidrail", name: "Rapid Rail KL", component: rail, color: "#1D4ED8" }
  - { id: "mrtfeeder",    name: "MRT Feeder Bus", component: feeder, color: "#00A651" }
route_type_components:
  "0": tram      # KL Monorail
  "1": rail      # LRT and MRT lines
  "3": bus
components:
  - { id: rail,   label: "LRT · MRT",   color: "#1D4ED8", icon: rail }
  - { id: tram,   label: "Monorail",    color: "#7B3FA0", icon: tram }
  - { id: bus,    label: "Rapid Bus",   color: "#E30613", icon: bus }
  - { id: feeder, label: "MRT Feeder",  color: "#00A651", icon: bus }
config:
  vehicle_poll_seconds: 20
  departures_refresh_seconds: 20
  features: { liveVehicles: true, board: true, pois: true, followAlong: true, bike: true }
  min_app_version: { ios: "1.0.0", android: "1.0.0" }
  update_urls:
    ios: "itms-beta://beta.itunes.apple.com/v1/app/6809010622"
    android: "https://play.google.com/store/apps/details?id=com.jeronimotech.opentransit"
  analytics: { enabled: true, retention_days: 90, k_threshold: 5 }
links:
  support: https://myrapid.com.my/contact-us/
  privacy: https://myrapid.com.my/privacy-policy/
landing:
  enabled: true
  slug: null
  locale: en
  theme: { primary_color: null, accent_color: "#E30613", logo_url: null, hero_image_url: null, dark_hero: true }
  hero:
    title: "Move around Kuala Lumpur with live data"
    subtitle: "LRT, MRT, monorail and Rapid KL buses in one trip, with live bus positions. Free, no account, open source."
    cta_primary: { label: "Open the web app", url: null }
    cta_secondary: { label: "How it works", url: "#features" }
  apps: { ios: null, android: null, web: null }
  highlights:
    - { icon: route, title: "Door to door", text: "LRT, MRT, monorail, Rapid KL buses, MRT feeders and walking combined into one itinerary, from an address rather than a stop." }
    - { icon: live,  title: "Buses in real time", text: "Rapid KL bus positions from data.gov.my on the map, with the direction each bus is heading." }
    - { icon: board, title: "Next departures at your stop", text: "The timetable, paired with live bus positions where the feed has them — and we say which is which." }
    - { icon: alarm, title: "Scheduled trips", text: "Home → Work by 9:00, or an appointment tomorrow: a reminder the evening before, twenty minutes before leaving with live data, and when it is time to go." }
    - { icon: go,    title: "Follow along", text: "Your trip on the lock screen, the Dynamic Island and Apple Watch: when your bus comes, when to get off and how long is left." }
    - { icon: open,  title: "Open data", text: "Built on Prasarana's GTFS and GTFS-Realtime published on data.gov.my. No accounts, no trackers, no ads; your trips and favourites stay on your device." }
    - { icon: globe, title: "In your language", text: "Bahasa Melayu, English, Arabic, Spanish, Portuguese, French and Italian: the app speaks the language of whoever uses it, visitors included." }
  screenshots: []
  stats: { show: true, items: [routes, stops, vehiclesLive] }
  partners:
    - { name: "data.gov.my", logo_url: null, url: https://developer.data.gov.my/realtime-api/gtfs-realtime, role: "GTFS and GTFS-Realtime" }
    - { name: "Rapid KL · Prasarana Malaysia", logo_url: null, url: https://myrapid.com.my, role: "Operator" }
  open_data:
    show: true
    links:
      - { label: "GTFS · Rapid Bus KL",   url: "https://api.data.gov.my/gtfs-static/prasarana?category=rapid-bus-kl" }
      - { label: "GTFS · Rapid Rail KL",  url: "https://api.data.gov.my/gtfs-static/prasarana?category=rapid-rail-kl" }
      - { label: "GTFS · MRT feeders",    url: "https://api.data.gov.my/gtfs-static/prasarana?category=rapid-bus-mrtfeeder" }
      - { label: "GTFS-RT · bus positions", url: "https://api.data.gov.my/gtfs-realtime/vehicle-position/prasarana?category=rapid-bus-kl" }
  faq:
    - { q: "Do I need an account?", a: "No. It works without signing up, without requiring your location and without ads. Favourites stay on your device." }
    - { q: "Where do the times come from?", a: "From Prasarana's timetable on data.gov.my, paired with live Rapid KL bus positions. Trains have no live feed yet, so their times are the timetable — and we say so." }
    - { q: "Is the fare shown?", a: "Not yet for Kuala Lumpur. Check myrapid.com.my for fares and the My50 pass." }
    - { q: "Can I use this for my city?", a: "Yes. The whole project is open source (MIT). Any city with a GTFS feed can deploy it and configure it without writing code." }
  contact:
    email: null
    url: https://myrapid.com.my/contact-us/
    social: { x: null, instagram: null, facebook: null, youtube: null, github: https://github.com/jeronimotech }
  footer: { legal_name: null, privacy_url: null, terms_url: null, attribution: null }
  seo:
    title: "Kuala Lumpur transit, live · open-source trip planner"
    description: "Plan trips across Kuala Lumpur with LRT, MRT, monorail and live Rapid KL buses, next departures at your stop and open data. Free and open source."
    og_image_url: null
