# Toronto (TTC) — the platform's second city, and the first with one operator running
# several modes. See `route_type_components` below: keying components on the agency, as
# Bogotá does, would put a bus icon on Line 1.
id: toronto
name: Toronto
country: CA
timezone: America/Toronto
locale: en-CA
center: { lat: 43.6532, lon: -79.3832 }        # downtown, not the centroid of the stops
bbox: [-79.6799, 43.5621, -79.0931, 43.9397]   # from the feed's own stops, padded
default_zoom: 12
modes: [WALK, BUS, TRAM, SUBWAY, BICYCLE]

branding:
  primary_color: "#DA291C"                      # TTC red

features:
  realtime_vehicles: true
  trip_updates: true         # via stop-keyed predictions; see feeds for why not via OTP
  alerts: true
  fares: true
  bike_share: true           # Bike Share Toronto (PBSC/Lyft), a separate operator from the TTC
  on_demand: true

attribution: "Data: Toronto Transit Commission (GTFS) · City of Toronto Open Data · Bike Share Toronto (GBFS) · Map: © OpenMapTiles © OpenStreetMap contributors"

feeds:
  gtfs_static_url: https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/7795b45e-e65a-4465-81fc-c36b9dfff169/resource/cfb6b2b8-6191-41e3-bda1-b175c51148cb/download/opendata_ttc_schedules.zip
  rt_positions_url: https://gtfsrt.ttc.ca/vehicles/position?format=binary
  rt_alerts_url: https://gtfsrt.ttc.ca/alerts/all?format=binary
  # Read by this API, not by OTP. None of this feed's trip_ids appear in the open-data
  # schedule (0 of 590 checked when the city was added) and it carries no
  # start_time/start_date/direction_id to match on instead, so OTP's stop-time updater
  # is deliberately absent from router-config.json — it could only discard every
  # message. The stop_ids do match (99.6%), so the arrivals are read by stop and paired
  # with the schedule here. See `apply_stop_predictions`.
  rt_tripupdates_url: https://gtfsrt.ttc.ca/trips/update?format=binary
  poll_seconds: 20
  static_refresh_hours: 24

otp:
  base_url: ${OTP_TORONTO_URL:-${OTP_URL:-http://localhost:8080}}
  feed_id: toronto           # must match build-config.json transitFeeds[].feedId

geocoder:
  photon_url: https://photon.komoot.io

agencies:
  - { id: "1", name: "Toronto Transit Commission", component: bus, color: "#DA291C" }

# One operator, three modes: the GTFS mode decides, not the agency.
route_type_components:
  "0": tram      # streetcars
  "1": rail      # Lines 1-4
  "3": bus

components:
  - { id: rail, label: "Subway",    color: "#DA291C", icon: rail }
  - { id: tram, label: "Streetcar", color: "#0054A6", icon: tram }
  - { id: bus,  label: "Bus",       color: "#DA291C", icon: bus }

config:
  vehicle_poll_seconds: 20
  departures_refresh_seconds: 20
  features: { liveVehicles: true, board: true, pois: true, followAlong: true, bike: true }
  min_app_version: { ios: "1.0.0", android: "1.0.0" }
  update_urls:
    ios: "itms-beta://beta.itunes.apple.com/v1/app/6809010622"
    android: "https://play.google.com/store/apps/details?id=com.jeronimotech.opentransit"
  analytics: { enabled: true, retention_days: 90, k_threshold: 5 }

links:
  support: https://www.ttc.ca/customer-service
  privacy: https://www.ttc.ca/privacy-policy

mobility:
  # Bike Share Toronto is run by the Toronto Parking Authority on PBSC hardware (the same vendor as
  # Tembici in Bogotá) and its GBFS is served by Lyft. Verified 2026-09-09: GBFS 3.0, 1066 stations,
  # all installed and renting, 7 764 bikes available. `network` must equal the `network` of the
  # vehicle-rental updater in otp/toronto/router-config.json.
  bike_share:
    - id: bike-share-toronto
      name: Bike Share Toronto
      network: bike_share_toronto            # = system_id in the feed
      gbfs_url: https://tor.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json
      color: "#00B140"                       # the green of the operator's own app icon
      url: https://bikesharetoronto.com/
      apps:
        ios: https://apps.apple.com/ca/app/id6499236069        # "Bike Share Toronto" (Lyft, Inc.)
        android: https://play.google.com/store/apps/details?id=com.lyft.android.torontoapp
      # Pinned, not derived: the pricing feed is 150+ plans of memberships, corporate and test tariffs,
      # and the heuristic in gbfs.py reads Spanish plan names and formats money the Colombian way.
      pricing_summary: "Pay as you go: $1 unlock + $0.12/min ($0.20 e-bike) · Day pass $15 · Annual $105"
      single_trip_price: { amount: 1.0, currency: CAD, label: "Unlock, then $0.12/min" }
      form_factors: [bicycle]                # the fleet is bikes only; no scooters are docked today

  on_demand:
    - id: uber
      name: Uber
      kind: ridehail
      color: "#000000"
      text_color: "#FFFFFF"
      estimate: { kind: none }      # estimates need Uber's partner API; the hand-off prefills the trip
      handoff:
        kind: template
        template: "https://m.uber.com/looking?client_id={clientId}&pickup={pickupJson}&drop[0]={dropoffJson}"
        web: https://m.uber.com/
        apps: { ios: "https://apps.apple.com/ca/app/id368677368", android: "https://play.google.com/store/apps/details?id=com.ubercab" }
      credentials: { clientId: "${UBER_CLIENT_ID:-}" }
      enabled: true
      order: 1
    - id: lyft
      name: Lyft
      kind: ridehail
      color: "#FF00BF"
      text_color: "#FFFFFF"
      estimate: { kind: none }
      handoff:
        # Lyft's universal link prefills from coordinates alone; `partner` is only for
        # attribution, so this works with no credentials rather than falling back to a
        # bare home page the way Uber does without its client id.
        kind: template
        template: "https://lyft.com/ride?id=lyft&pickup[latitude]={pickupLat}&pickup[longitude]={pickupLon}&destination[latitude]={dropoffLat}&destination[longitude]={dropoffLon}"
        web: https://ride.lyft.com/
        apps: { ios: "https://apps.apple.com/ca/app/id529379082", android: "https://play.google.com/store/apps/details?id=me.lyft.android" }
      enabled: true
      order: 2

landing:
  enabled: true
  slug: null
  locale: en
  theme: { primary_color: null, accent_color: "#0054A6", logo_url: null, hero_image_url: null, dark_hero: true }
  hero:
    title: "Ride Toronto with live data"
    subtitle: "Plan a trip, watch the streetcars move and know when your bus arrives. Free, no account, open source."
    cta_primary: { label: "Open the web app", url: null }
    cta_secondary: { label: "How it works", url: "#features" }
  apps: { ios: null, android: null, web: null }
  highlights:
    - { icon: route, title: "Door to door", text: "Subway, streetcar, bus and walking combined into one itinerary, from an address rather than a stop." }
    - { icon: live,  title: "Vehicles in real time", text: "Over a thousand TTC vehicles on the map, with the direction each one is heading." }
    - { icon: board, title: "Arrivals at your stop", text: "Live predictions from the TTC feed, paired with the schedule — and we say which is which." }
    - { icon: bike,  title: "Bike Share Toronto", text: "Over a thousand docking stations with live bike and dock counts, planned as part of the trip rather than shown on a separate map." }
    - { icon: open,  title: "Open data", text: "Built on the City of Toronto's GTFS and the TTC's GTFS-Realtime. No accounts, no trackers, no ads." }
  stats: { show: true, items: [routes, stops, vehiclesLive, bikeStations, alertsActive] }
  partners:
    - { name: "Toronto Transit Commission", logo_url: null, url: https://www.ttc.ca, role: "GTFS and GTFS-Realtime" }
    - { name: "City of Toronto Open Data",  logo_url: null, url: https://open.toronto.ca, role: "Schedule dataset" }
    - { name: "Bike Share Toronto",         logo_url: null, url: https://bikesharetoronto.com, role: "GBFS bike share" }
  open_data:
    show: true
    links:
      - { label: "GTFS schedule",        url: https://open.toronto.ca/dataset/ttc-routes-and-schedules/ }
      - { label: "GTFS-RT · vehicles",   url: "https://gtfsrt.ttc.ca/vehicles/position?format=binary" }
      - { label: "GTFS-RT · arrivals",   url: "https://gtfsrt.ttc.ca/trips/update?format=binary" }
      - { label: "GTFS-RT · alerts",     url: "https://gtfsrt.ttc.ca/alerts/all?format=binary" }
      - { label: "GBFS · bike share",   url: "https://tor.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json" }
  faq:
    - { q: "Do I need an account?", a: "No. It works without signing up, without requiring your location and without ads. Favourites stay on your device." }
    - { q: "Where do the arrival times come from?", a: "From the TTC's own GTFS-Realtime feed. Its trip identifiers do not match the published schedule, so we pair each prediction with the timetable by stop and route, and show the scheduled time when there is no prediction." }
    - { q: "Is the fare shown exact?", a: "Fares are not shown for Toronto yet. Check ttc.ca for current fares and transfer rules." }
    - { q: "Can I use this for my city?", a: "Yes. The whole project is open source (MIT). Any city with a GTFS feed can deploy it and configure it without writing code." }
  contact:
    email: null
    url: https://www.ttc.ca/customer-service
    social: { x: null, instagram: null, facebook: null, youtube: null, github: https://github.com/jeronimotech }
  footer:
    legal_name: null
    privacy_url: null
    terms_url: null
    attribution: null
  seo:
    title: "Toronto transit, live · open-source trip planner"
    description: "Plan trips across Toronto with live TTC vehicles, arrivals at your stop and open data. Free and open source."
    og_image_url: null
